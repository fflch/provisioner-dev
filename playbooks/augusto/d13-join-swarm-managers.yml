---
- name: Adiciona Managers ao Cluster Swarm
  hosts: 
    - d13-swarm-manager2
    - d13-swarm-manager3
  become: true

  vars:
    swarm_manager_ip: 192.168.8.95

  tasks:
    - name: Aplica a Role fflch.tasks
      include_role:
        name: fflch.tasks
      vars:
        tasks_common: true

    - include_role:
        name: geerlingguy.docker

    - name: Obtem o token de Manager no Manager Principal
      ansible.builtin.command:
        cmd: docker swarm join-token -q manager
      delegate_to: d13-swarm-manager1
      become: true
      register: swarm_manager_token
      changed_when: false
      run_once: true
      no_log: true

    - name: Verifica o estado atual do Swarm
      ansible.builtin.command:
        cmd: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: swarm_state
      changed_when: false
      failed_when: false

    - name: Adiciona o Manager ao Swarm
      ansible.builtin.command:
        cmd: >
          docker swarm join
          --token {{ swarm_manager_token.stdout }}
          {{ hostvars['d13-swarm-manager1']['ansible_host'] }}:2377
      when:
        - inventory_hostname != 'd13-swarm-manager1'
        - swarm_state.stdout != 'active'
      no_log: true
