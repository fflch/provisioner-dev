---
- name: Adiciona Workers ao Cluster Swarm
  hosts: 
    - d13-swarm-worker1
    - d13-swarm-worker2
  become: true

  vars:
    swarm_manager_ip: 192.168.8.95

  tasks:
    - name: Aplica a Role fflch.tasks
      include_role:
        name: fflch.tasks
      vars:
        tasks_common: true

    - include_role:
        name: geerlingguy.docker

    - name: Obtem o token de Worker no Manager Principal
      ansible.builtin.command:
        cmd: docker swarm join-token -q worker
      delegate_to: d13-swarm-manager1
      become: true
      register: swarm_worker_token
      changed_when: false
      run_once: true
      no_log: true

    - name: Verifica Estado Atual do Swarm
      command: docker info --format '{{ "{{" }} .Swarm.LocalNodeState {{ "}}" }}'
      register: swarm_state
      failed_when: false
      changed_when: false

    - name: Adiciona o Worker ao Swarm
      ansible.builtin.command:
        cmd: >
          docker swarm join
          --token {{ swarm_worker_token.stdout }}
          {{ hostvars['d13-swarm-manager1']['ansible_host'] }}:2377
      when:
        - swarm_state.stdout != 'active'
      no_log: true
