---
- name: Instala o Swarm Manager Principal
  become: yes
  hosts: d13-swarm-manager1

  vars:
    swarm_advertise_addr: "{{ ansible_host }}"

  tasks:

    - name: Aplica a Role fflch.tasks
      include_role:
        name: fflch.tasks
      vars:
        tasks_common: true

    - include_role:
        name: geerlingguy.docker

    - name: Verifica se o Host já participa de um Cluster Swarm
      command: docker info --format '{{ "{{" }} .Swarm.LocalNodeState {{ "}}" }}'
      register: swarm_status
      changed_when: false

    - name: Inicializa o Swarm
      command: >
        docker swarm init
        --advertise-addr {{ swarm_advertise_addr }}
      when: swarm_status.stdout != "active"

    - name: Obtem o token de Manager no Manager Principal
      ansible.builtin.command:
        cmd: docker swarm join-token -q manager
      delegate_to: d13-swarm-manager1
      become: true
      register: swarm_manager_token
      changed_when: false
      run_once: true
      no_log: true  

    - name: Obtem o token de Worker no Manager Principal
      ansible.builtin.command:
        cmd: docker swarm join-token -q worker
      delegate_to: d13-swarm-manager1
      become: true
      register: swarm_worker_token
      changed_when: false
      run_once: true
      no_log: true  
